
[project]
name = "knowflow-ai"
version = "0.1.0"
description = "An engineering knowledge intelligence platform powered by RAG"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=3.6.1",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
